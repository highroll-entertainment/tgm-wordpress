name: Release to WordPress.org

# On a `v<x.y.z>` tag: test, build from .distignore and deploy to the WordPress.org SVN repository.
# The plugin header Version, readme.txt Stable tag and TERRAGAMING_ADS_VERSION must match the tag
# (tests/unit/ReleaseTest.php checks the first three agree). Needs the approved WordPress.org
# listing and the SVN_USERNAME / SVN_PASSWORD secrets on the `wordpress-org` environment.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
      - run: ./scripts/build.sh
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: The tag matches the plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -qx "Stable tag: $VERSION" readme.txt
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/terragaming-media-ads
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: terragaming-media-ads
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/terragaming-media-ads
